name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-sanity:
    name: Release sanity
    # Only tags of the form refs/tags/v* start a release.
    if: startsWith(github.ref, 'refs/tags/v*')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: tasks/ must be gone before a release
        run: test ! -e tasks
      - name: Version matches the tag and CHANGELOG
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(grep -m1 '^version = "' Cargo.toml | sed 's/^version = "//; s/"$//')"
          if [ "$tag_version" != "$workspace_version" ]; then
            echo "tag version '$tag_version' does not match workspace version '$workspace_version'"
            exit 1
          fi
          if ! grep -qF "$tag_version" CHANGELOG.md; then
            echo "CHANGELOG.md does not mention version $tag_version"
            exit 1
          fi
