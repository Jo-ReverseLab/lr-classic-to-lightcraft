name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices and
# publishes the score for the README badge. Based on GitHub's starter
# workflow (actions/starter-workflows, code-scanning/scorecard.yml).

on:
  branch_protection_rule:
  schedule:
    - cron: '30 3 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results can only be published from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish the results and get a badge.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
