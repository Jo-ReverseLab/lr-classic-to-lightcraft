[package]
name = "lr2lc"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lr2lc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lc-writer = { path = "../lc-writer" }
lr-reader = { path = "../lr-reader" }
model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lrcat-fixtures = { path = "../../tests/fixtures/generator" }
serde_json = "1"
tempfile = "3"
