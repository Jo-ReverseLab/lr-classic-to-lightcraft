[package]
name = "lr2lc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "lr2lc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
lr2lc-core = { path = "../lr2lc-core" }
model = { path = "../model" }

[dev-dependencies]
lc-writer = { path = "../lc-writer" }
lc-test-support = { path = "../lc-test-support" }
lrcat-fixtures = { path = "../../tests/fixtures/generator" }
serde_json = "1"
tempfile = "3"
